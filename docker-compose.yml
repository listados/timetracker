services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      args:
        UID: 1001
        GID: 1001
    container_name: timetracking-app
    volumes:
      - .:/var/www
    depends_on:
      - mysql
    networks:
      - timetracking

  nginx:
    image: nginx:alpine
    container_name: timetracking-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - timetracking

  mysql:
    image: mysql:8.0
    container_name: timetracking-mysql
    environment:
      MYSQL_DATABASE: timetracking
      MYSQL_USER: timetracking
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - timetracking

networks:
  timetracking:
    driver: bridge

volumes:
  mysql_data:
    driver: local
